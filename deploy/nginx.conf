# LogScope Nginx reverse proxy for the two-replica scale profile.
#
# - Least-connections upstream routing
# - Request buffering disabled for the analysis route
# - /metrics blocked at the edge
# - POST retry disabled (proxy_next_upstream off)
# - Timeouts aligned with application deadlines

worker_processes auto;

events {
    worker_connections 128;
}

http {
    # Request lines can contain query parameters; application logs provide
    # sanitized route/status records instead.
    access_log off;
    # Upstream: both API replicas
    upstream api_backend {
        least_conn;
        server api-a:8000;
        server api-b:8000;
    }

    server {
        listen 80;
        server_name _;

        # Match the application upload limit
        client_max_body_size 100m;

        # Disable request buffering so the body streams directly
        proxy_request_buffering off;

        # Block metrics from external access
        location /metrics {
            return 403;
        }

        location / {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Timeouts: upstream response > app deadline (120s) + margin
            proxy_connect_timeout 5s;
            proxy_read_timeout 135s;
            proxy_send_timeout 15s;

            # Do NOT retry POST uploads against another replica
            proxy_next_upstream off;
        }
    }
}
