# LogScope Docker Compose
# Profiles:
#   local — single API on host port 8000
#   scale — two API replicas behind Nginx on host port 8080
#
# Usage:
#   docker compose --profile local up --build
#   docker compose --profile scale up --build
#
# The scale profile requires API_TOKEN in environment or .env file.
# Stop one profile before starting the other (they use different ports).

services:
  # --- Local single-instance profile ---
  api:
    build: .
    profiles: ["local"]
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - MAX_UPLOAD_BYTES=${MAX_UPLOAD_BYTES:-104857600}
      - MAX_LINE_BYTES=${MAX_LINE_BYTES:-65536}
      - MAX_SERVICES=${MAX_SERVICES:-10000}
      - PROCESSING_CHUNK_BYTES=${PROCESSING_CHUNK_BYTES:-65536}
      - MAX_PARSE_ERROR_SAMPLES=${MAX_PARSE_ERROR_SAMPLES:-10}
      - MAX_ACTIVE_ANALYSES=${MAX_ACTIVE_ANALYSES:-1}
      - UPLOAD_IDLE_TIMEOUT_SECONDS=${UPLOAD_IDLE_TIMEOUT_SECONDS:-15}
      - ANALYSIS_TIMEOUT_SECONDS=${ANALYSIS_TIMEOUT_SECONDS:-120}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    restart: unless-stopped
    read_only: true

  # --- Scale profile: two replicas behind Nginx ---
  api-a:
    build: .
    profiles: ["scale"]
    environment:
      - MAX_UPLOAD_BYTES=104857600
      - MAX_LINE_BYTES=${MAX_LINE_BYTES:-65536}
      - MAX_SERVICES=${MAX_SERVICES:-10000}
      - PROCESSING_CHUNK_BYTES=${PROCESSING_CHUNK_BYTES:-65536}
      - MAX_PARSE_ERROR_SAMPLES=${MAX_PARSE_ERROR_SAMPLES:-10}
      - MAX_ACTIVE_ANALYSES=${MAX_ACTIVE_ANALYSES:-1}
      - UPLOAD_IDLE_TIMEOUT_SECONDS=${UPLOAD_IDLE_TIMEOUT_SECONDS:-15}
      - ANALYSIS_TIMEOUT_SECONDS=${ANALYSIS_TIMEOUT_SECONDS:-120}
      - API_TOKEN=${API_TOKEN:-}
      - REQUIRE_API_TOKEN=1
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    restart: unless-stopped
    read_only: true
    networks:
      - internal

  api-b:
    build: .
    profiles: ["scale"]
    environment:
      - MAX_UPLOAD_BYTES=104857600
      - MAX_LINE_BYTES=${MAX_LINE_BYTES:-65536}
      - MAX_SERVICES=${MAX_SERVICES:-10000}
      - PROCESSING_CHUNK_BYTES=${PROCESSING_CHUNK_BYTES:-65536}
      - MAX_PARSE_ERROR_SAMPLES=${MAX_PARSE_ERROR_SAMPLES:-10}
      - MAX_ACTIVE_ANALYSES=${MAX_ACTIVE_ANALYSES:-1}
      - UPLOAD_IDLE_TIMEOUT_SECONDS=${UPLOAD_IDLE_TIMEOUT_SECONDS:-15}
      - ANALYSIS_TIMEOUT_SECONDS=${ANALYSIS_TIMEOUT_SECONDS:-120}
      - API_TOKEN=${API_TOKEN:-}
      - REQUIRE_API_TOKEN=1
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    restart: unless-stopped
    read_only: true
    networks:
      - internal

  nginx:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    profiles: ["scale"]
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-a
      - api-b
    networks:
      - internal
    restart: unless-stopped

networks:
  internal:
    driver: bridge
