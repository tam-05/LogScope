[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "logscope"
version = "1.0.0"
description = "Streaming log file analyzer with REST API and CLI"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "httpx>=0.27.0",
    "anyio>=4.4.0",
    "prometheus-client>=0.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "hypothesis>=6.108.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "psutil>=6.0.0",
]

[project.scripts]
logscope = "logscope.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/logscope"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
packages = ["logscope"]
mypy_path = "src"
